name: CI/CD Pipeline Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Test Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false

      - name: Test Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false

      - name: Test Integration with Docker Compose
        run: |
          docker compose up -d
          docker compose ps
          sleep 10
          curl http://localhost:8000/health || exit 1
          docker compose down
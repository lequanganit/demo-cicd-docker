name: CI/CD Pipeline Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false

      - name: Test Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false

      - name: Test Integration with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 20
          docker compose ps
          curl --fail http://localhost:8000/health || (docker compose logs && exit 1)
          docker compose down

name: CI/CD Pipeline Build, Test & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-test-and-deploy:
    name: Build, Test and Deploy Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. TEST INTEGRATION (CI)
      - name: Test Integration with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 20
          docker compose ps
          curl --fail http://localhost:8000/health || (docker compose logs && exit 1)
          docker compose down

      # 2. BUILD & PUSH IMAGES (CD)
      - name: Build and Push Frontend Image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: lequangan/demo-frontend:latest

      - name: Build and Push Backend Image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: lequangan/demo-backend:latest
